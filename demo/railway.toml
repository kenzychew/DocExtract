# Railway service config for this demo. Assumes the Railway service's Root
# Directory is set to `demo/` (commands below are relative to that), while
# `app.py` still reaches into `../src` for the `docfield` package -- Railway's
# Root Directory only changes the build/run working directory, the full repo
# checkout stays on disk. Full Railway wiring (env vars, domain, service
# creation) is a separate follow-up; this file is the service-level config
# that follow-up will attach.
[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements-demo.txt"

[deploy]
startCommand = "uvicorn app:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
