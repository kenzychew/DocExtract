# STALE: Railway only reads railway.toml/railway.json at the repo root, not
# in subdirectories. The config Railway actually uses is ../railway.toml.
# This file is kept only for reference and is not consulted by Railway.
[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements-demo.txt"

[deploy]
startCommand = "uvicorn app:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
